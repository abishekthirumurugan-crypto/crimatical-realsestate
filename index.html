<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The header bar is the page's own glass on every route, including over
         the film — it stays light even where the content behind it is dark. -->
    <meta name="theme-color" content="#f7f4f0" />

    <title>Temp RealEstate — Block A, Plot 7, Perungudi</title>
    <meta
      name="description"
      content="A walk through a finished apartment at Block A, Plot 7 — street to terrace, scrubbed frame by frame as you scroll. Six storeys, twenty-four residences, Perungudi, Chennai."
    />

    <link rel="icon" type="image/png" sizes="96x96" href="/image/logo-96.png" />
    <link rel="apple-touch-icon" href="/image/logo-192.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Temp RealEstate — Block A, Plot 7, Perungudi" />
    <meta
      property="og:description"
      content="A walk through a finished apartment at Block A, Plot 7 — street to terrace, scrubbed frame by frame as you scroll."
    />
    <meta property="og:image" content="/image/logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Poppins carries the whole page: headings, body and figures. Sancreek
         is the wordmark only — one decorative face, used once, on the name. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Sancreek&display=swap"
      rel="stylesheet"
    />

    <!-- The scrub track is the largest byte on the page and the only thing
         standing between load and first interaction, so it starts in parallel
         with the JS bundle instead of waiting for React to mount.

         `as="fetch"`, not `as="video"`: ScrollVideo's blob strategy downloads
         the file with fetch() so it can report real progress, and a preload
         only warms the cache when its destination matches the request that
         follows. Preloading it as a media element would start a second,
         separate download.

         It is injected rather than written as a static <link> because this one
         index.html serves all four routes: as static markup it would pull 3 MB
         on About, Journal and Contact, which never mount the film. The script
         is inline and synchronous, so the hint still lands in <head> ahead of
         the module bundle — it just lands only where it will be used.

         The width test mirrors the `media` on ScrollVideo's sources, so a phone
         warms the 1.1 MB cut and never touches the 2.0 MB one.

         `crossOrigin` is load-bearing and its absence was a bug worth the note.
         A preload is only reused when the request that follows matches it on
         mode AND credentials, and `as="fetch"` always preloads in CORS mode
         while `fetch()` defaults to credentials "same-origin" — which is what
         `crossorigin="anonymous"` means. Without it the two never matched, the
         warmed copy was thrown away, and the file was downloaded a second time:
         measured at 1.76 MB on a phone against the 0.88 MB it should be, and
         2.58 MB against 1.29 MB on a desktop. The browser says so in as many
         words — "a preload for ... is not used because the request credentials
         mode does not match" — which is only visible if someone is reading the
         console on the one route that shows it.

         Phones are skipped entirely. Every phone now runs the still sequence
         and never fetches the mp4 at all, so warming it there is a 0.88 MB
         download that nothing ever reads. The width test has to keep agreeing
         with `pickFilmMode` in Home.tsx — if that changes, this must follow. -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (path !== '/' && path !== '/index.html') return;

        // The stills path fetches no video, so there is nothing to warm.
        if (window.matchMedia('(max-width: 640px)').matches) return;

        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = '/video/walkthrough.mp4';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
