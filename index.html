<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The header bar is white on every route. -->
    <meta name="theme-color" content="#ffffff" />

    <title>Temp RealEstate — Block A, Plot 7, Perungudi</title>
    <meta
      name="description"
      content="Twenty-six months of construction on Block A, Plot 7, from graded earth to handover — scrubbed frame by frame as you scroll. Mid-rise residential in Chennai since 2011."
    />

    <link rel="icon" type="image/png" sizes="96x96" href="/image/logo-96.png" />
    <link rel="apple-touch-icon" href="/image/logo-192.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Temp RealEstate — Block A, Plot 7, Perungudi" />
    <meta
      property="og:description"
      content="Twenty-six months of construction, scrubbed frame by frame as you scroll."
    />
    <meta property="og:image" content="/image/logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Poppins carries the whole page: headings, body and figures. Sancreek
         is the wordmark only — one decorative face, used once, on the name. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Sancreek&display=swap"
      rel="stylesheet"
    />

    <!-- The scrub track is the largest byte on the page and the only thing
         standing between load and first interaction, so it starts in parallel
         with the JS bundle instead of waiting for React to mount.

         `as="fetch"`, not `as="video"`: ScrollVideo's blob strategy downloads
         the file with fetch() so it can report real progress, and a preload
         only warms the cache when its destination matches the request that
         follows. Preloading it as a media element would start a second,
         separate download.

         It is injected rather than written as a static <link> because this one
         index.html serves all four routes: as static markup it would pull 3 MB
         on About, Journal and Contact, which never mount the film. The script
         is inline and synchronous, so the hint still lands in <head> ahead of
         the module bundle — it just lands only where it will be used.

         The width test mirrors the `media` on ScrollVideo's sources, so a phone
         warms the 1.3 MB cut and never touches the 3 MB one. -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (path !== '/' && path !== '/index.html') return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.href = window.matchMedia('(max-width: 640px)').matches
          ? '/video/block-a-mobile.mp4'
          : '/video/block-a.mp4';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
